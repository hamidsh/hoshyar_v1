<!DOCTYPE html>
<html data-theme="light">
<head>
    <title>هُشیار - داشبورد توییت‌ها</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@2.51.5/dist/full.css" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@1.9.6"></script>
    <style>
        @font-face {
            font-family: 'Vazir';
            src: url('/static/fonts/Vazir.ttf');
        }
        body { font-family: 'Vazir', sans-serif; }
    </style>
</head>
<body class="bg-gray-100">
    <div class="container mx-auto p-4">
        <h1 class="text-3xl font-bold mb-4">هُشیار - داشبورد توییت‌ها</h1>
        <form hx-get="{% url 'tweet_list' %}" hx-target="#tweet-table" class="mb-4 flex gap-2">
            <input type="text" name="q" value="{{ search_query }}" class="input input-bordered w-full max-w-xs" placeholder="جستجو (مثال: from:elonmusk)">
            <input type="number" name="max_tweets" value="10" class="input input-bordered w-24" placeholder="تعداد" min="1" max="100">
            <button type="submit" class="btn btn-primary">استخراج</button>
        </form>
        <div id="tweet-table" class="overflow-x-auto">
            {% include "twitter/partials/tweet_table.html" %}
        </div>
    </div>
</body>
</html>
